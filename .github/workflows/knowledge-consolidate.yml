name: Daily knowledge consolidation

# Merges every open `knowledge-sweep` PR onto one branch and has Claude reconcile
# the result — deduplicating, resolving contradictions, and moving each claim onto
# the page that should own it. The output is a single PR for review; nothing here
# merges to master. The per-author PRs stay open until this consolidation lands.

on:
  schedule:
    # 05:00 UTC daily, before the working day.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List the sweep PRs that would be consolidated, then stop'
        type: boolean
        default: false
      verbose:
        description: "Log Claude's full output (this repo is public — tool results become world-readable)"
        type: boolean
        default: false
      timeout_minutes:
        description: 'Job budget'
        type: number
        default: 45

permissions:
  contents: read

concurrency:
  group: knowledge-consolidate
  cancel-in-progress: false

env:
  CONSOLIDATION_BRANCH: knowledge/consolidated

jobs:
  consolidate:
    runs-on: ubuntu-latest
    # fromJSON because timeout-minutes must be a number and a dispatch input
    # arrives as a string — a bare expression invalidates the workflow file.
    timeout-minutes: ${{ fromJSON(github.event.inputs.timeout_minutes || '45') }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CLAUDE_CODE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_CODE_PRIVATE_KEY }}

      - name: Checkout workspace
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          # An app token dies an hour after minting and Claude can run for most
          # of that; the push step mints a fresh one instead.
          persist-credentials: false

      - name: Find open sweep PRs
        id: find
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh pr list --label knowledge-sweep --state open \
            --json number,headRefName,author,url,additions,deletions \
            > /tmp/sweeps.json

          count=$(jq 'length' /tmp/sweeps.json)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          {
            echo '## Open sweep PRs'
            jq -r '.[] | "- #\(.number) `\(.headRefName)` by \(.author.login) (+\(.additions)/-\(.deletions))"' /tmp/sweeps.json
            [[ "$count" == "0" ]] && echo '_none_'
          } >> "$GITHUB_STEP_SUMMARY"

          if (( count == 0 )); then
            echo "::notice::no open sweep PRs"
          fi

      - name: Install mikefarah/yq
        if: steps.find.outputs.count != '0' && inputs.dry_run != true
        run: |
          set -euo pipefail
          # scripts/docs-index rejects the python jq wrapper.
          if yq --version 2>&1 | grep -q mikefarah; then
            yq --version
          else
            sudo wget -qO /usr/local/bin/yq \
              https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
            yq --version
          fi

      - name: Merge sweep branches onto the consolidation branch
        id: merge
        if: steps.find.outputs.count != '0' && inputs.dry_run != true
        run: |
          set -euo pipefail
          git config user.name "claude-code-bot[bot]"
          git config user.email "claude-code-bot[bot]@users.noreply.github.com"

          # Always rebuild from master: carrying yesterday's unmerged version
          # forward would reconcile against content a human may have rejected.
          git checkout -q -B "$CONSOLIDATION_BRANCH" origin/master

          : > /tmp/conflicts.txt
          : > /tmp/merged.txt
          while read -r branch; do
            git fetch -q origin "$branch"
            if git merge --no-edit -q "origin/$branch" 2>/dev/null; then
              echo "$branch" >> /tmp/merged.txt
            else
              # Conflict markers are left in the tree deliberately — two people
              # documenting the same finding is the overlap this job reconciles.
              echo "$branch" >> /tmp/conflicts.txt
              git add -A
              git commit -q --no-edit -m "Merge $branch (conflicts left for reconciliation)"
            fi
          done < <(jq -r '.[].headRefName' /tmp/sweeps.json)

          echo "conflicts=$(wc -l < /tmp/conflicts.txt)" >> "$GITHUB_OUTPUT"
          {
            echo '## Merge result'
            echo "clean: $(wc -l < /tmp/merged.txt), conflicted: $(wc -l < /tmp/conflicts.txt)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure AWS credentials
        if: steps.find.outputs.count != '0' && inputs.dry_run != true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          # Shared HMCTS role; this repo must be in its trust policy.
          role-to-assume: arn:aws:iam::313941174580:role/HMCTSClaudeGitHubActionsRole
          aws-region: eu-west-1

      - name: Reconcile with Claude
        if: steps.find.outputs.count != '0' && inputs.dry_run != true
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_DEFAULT_SONNET_MODEL: 'eu.anthropic.claude-sonnet-5'
          ANTHROPIC_DEFAULT_HAIKU_MODEL: 'eu.anthropic.claude-haiku-4-5-20251001-v1:0'
        with:
          use_bedrock: "true"
          github_token: ${{ steps.app-token.outputs.token }}
          # Off by default: tool results would become world-readable.
          show_full_output: ${{ inputs.verbose == true }}
          prompt: |
            Documentation improvements from ${{ steps.find.outputs.count }}
            engineer(s) have been merged onto the current branch. Each came from
            `scripts/knowledge-sweep` reviewing that engineer's own workspace
            sessions, so they were written independently and never saw each
            other's work. Reconcile them into coherent documentation and commit.
            A later workflow step pushes — do not push yourself.

            Read @CLAUDE.md first.

            Start by seeing what arrived:

                git diff --stat origin/master...HEAD
                git diff origin/master...HEAD

            ${{ steps.merge.outputs.conflicts != '0' && 'Some branches merged with conflicts and the markers were committed deliberately. Find them with `git grep -n "^<<<<<<<"` and resolve every one — that is the highest-value work in this job, because a conflict means two engineers documented the same thing.' || 'All branches merged cleanly, so the overlap is semantic rather than textual — the same finding written into two different pages, in different words.' }}

            Then work through the merged content:

            1. **Resolve every conflict marker.** Keep the clearer statement, or
               write a better one covering both. Never keep both versions.
            2. **Deduplicate across pages.** The same claim appearing on two
               pages is the common failure of this pipeline. Decide which page
               should own it, and cross-link from the other rather than
               repeating it.
            3. **Reconcile contradictions.** Where two engineers state
               incompatible things, neither may be wrong — they may have hit
               different environments or versions. Say which case each applies
               to. If you cannot tell, keep the more cautious claim and leave a
               `<!-- REVIEW: ... -->` comment naming the disagreement.
            4. **Check placement.** Sweep output tends to append to whichever
               page came up first. Steps belong on how-to pages, facts on
               reference pages, reasons on explanation pages. Move content that
               landed in the wrong quadrant.
            5. **Cut.** Prefer sharpening existing prose to accumulating it. A
               page that grew a bullet list of unrelated gotchas needs those
               folded into the sections they belong to, or dropped. Content that
               is session-specific, trivially rediscoverable, or already stated
               elsewhere should be deleted outright — the individual sweeps have
               no view of the whole and over-report.
            6. Run `./scripts/docs-index` if any page was added, moved or
               retitled, and commit `DOCS.md` with it.

            Commit INCREMENTALLY as you finish each area. This job is killed at
            its wall-clock budget; a commit that exists gets pushed, and
            uncommitted work is thrown away.

            Rules:
            - Do NOT run `git push`. A later step does it with a fresh token and
              a visible error if it fails.
            - ONLY `git add` paths under `docs/`, `apps/*/docs/`, or `DOCS.md`.
            - There are no cloned source repos in this checkout, so you cannot
              verify claims against source. Do not assert anything the merged
              content does not already support. Where a claim looks doubtful,
              leave a `<!-- REVIEW: ... -->` comment rather than deleting a
              finding you cannot check.
            - This repository is public. If any merged content contains a token,
              credential, connection string, hostname with embedded
              credentials, case data, party name, or email address, delete it
              and note that you did.
            - Documentation never names an individual, a session, a ticket in
              passing, or an AI tool as a source.
            - On any page you change, set `status: draft` and drop
              `last_reviewed` if present. Nothing here has been verified against
              source.
            - Do NOT put `Co-Authored-By: Claude`, a `Claude-Session` trailer, or
              any claude.ai link in the commit message.
            - If the merged content genuinely needed no reconciliation, make no
              commit and say so.
          claude_args: |
            --dangerously-skip-permissions
            --model sonnet
            --append-system-prompt "You are running unattended in a GitHub Action on hmcts/cft-workspace, consolidating unreviewed documentation proposals from several engineers into one PR for human review. Your output is a PR, not a merge to master. There are no source repos in this checkout — reconcile only what the merged diff supports, and mark anything you cannot verify with a REVIEW comment rather than asserting it. Commit incrementally; the job is killed at its budget. Do not run git push."
            --allowedTools "Read,Glob,Grep,Write,Edit,Bash(git:*),Bash(./scripts/docs-index:*),Bash(yq:*)"

      # The token from the top of the job may have expired during the run.
      - name: Generate a fresh GitHub App token
        id: push-token
        if: always() && steps.find.outputs.count != '0' && inputs.dry_run != true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CLAUDE_CODE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_CODE_PRIVATE_KEY }}

      - name: Push and open or update the consolidation PR
        # always(): a commit that exists must reach the branch even if the job
        # was cancelled at its budget. The guards below make that safe.
        if: always() && steps.find.outputs.count != '0' && inputs.dry_run != true
        env:
          TOKEN: ${{ steps.push-token.outputs.token }}
          GH_TOKEN: ${{ steps.push-token.outputs.token }}
        run: |
          set -uo pipefail

          if [[ -z "$TOKEN" ]]; then
            echo "::error::no token — could not push; see the token step above"
            exit 1
          fi

          if [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/master)" ]]; then
            echo "::notice::nothing to consolidate"
            exit 0
          fi

          if git grep -q '^<<<<<<< ' -- docs 'apps/*/docs' 2>/dev/null; then
            echo "::error::unresolved conflict markers remain — not opening a PR"
            exit 1
          fi

          # Header rather than remote URL, so a git error cannot echo the token.
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          remote="https://github.com/$GITHUB_REPOSITORY.git"
          # Force, because the branch is rebuilt from master on every run.
          if ! git -c "http.extraheader=$header" push --force "$remote" \
               "HEAD:refs/heads/$CONSOLIDATION_BRANCH" 2>&1 | tee /tmp/push.log; then
            echo "::error::push failed"
            { echo '## Push failed'; echo '```'; cat /tmp/push.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          sources=$(jq -r '.[] | "- #\(.number) by @\(.author.login)"' /tmp/sweeps.json)
          body=$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
            "Consolidated documentation from the open \`knowledge-sweep\` PRs listed below, reconciled into one reviewable change." \
            "$sources" \
            "**Unreviewed machine output.** Claims are drawn from engineers' session activity and have not been checked against source. Verify before merging, and look for any \`<!-- REVIEW: -->\` comments." \
            "Rebuilt from master on every daily run. Close the source PRs when this lands.")

          existing=$(gh pr list --head "$CONSOLIDATION_BRANCH" --state open --json number --jq '.[0].number // ""')
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --body "$body" >/dev/null
            echo "::notice::updated PR #$existing"
          else
            gh label create knowledge-consolidation --color 0E8A16 \
              --description "Reconciled output of the daily knowledge consolidation" >/dev/null 2>&1 || true
            url=$(gh pr create --base master --head "$CONSOLIDATION_BRANCH" \
              --title "docs: consolidated knowledge sweep $(date +%F)" \
              --body "$body" --label knowledge-consolidation)
            echo "::notice::opened $url"
          fi
